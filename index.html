<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎵 Local & YouTube Music Player</h1>
    </header>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search YouTube...">
      <button id="searchBtn">Search</button>
    </div>

    <div class="song-section">
      <h2>🎧 Local Songs</h2>
      <div id="localSongs" class="song-list"></div>
    </div>

    <div class="search-results">
      <h2>📡 YouTube Results</h2>
      <div id="youtubeResults" class="song-list"></div>
    </div>
  </div>

  <div id="nowPlaying">
    <img id="nowThumb" src="" alt="thumb" />
    <div id="nowInfo">
      <div id="nowTitle">Nothing playing</div>
    </div>
  </div>

  <audio id="player" controls></audio>
  <script src="renderer.js"></script>
</body>
</html>
