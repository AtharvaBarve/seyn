<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ViTune</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎵 ViTune</h1>
      <div class="header-actions">
        <button id="selectFolderBtn" class="nav-btn active" data-view="library">📁 Select Folder</button>
        <button id="searchBtn" class="nav-btn" data-view="search">🔍 Search</button>
        <button id="queueBtn" class="nav-btn" data-view="queue">📋 Queue</button>
      </div>
    </header>

    <div class="main-content">
      <!-- Views will be rendered here -->
      <div class="view home-view"></div>
      <div class="view library-view" style="display:none;"></div>
      <div class="view search-view" style="display:none;"></div>
      <div class="view queue-view" style="display:none;"></div>
    </div>

    <!-- Persistent now-playing bar -->
    <div class="now-playing-bar-container">
      <div class="now-playing-bar">
        <div class="now-playing-left">
          <img id="nowThumb" class="now-playing-thumb" src="" alt="artwork" />
          <div class="now-playing-info">
            <div id="nowTitle" class="now-playing-title">Nothing playing</div>
            <div id="nowArtist" class="now-playing-artist">—</div>
          </div>
        </div>
        <div class="now-playing-center">
          <button id="prevBtn" class="now-playing-btn prev-btn" aria-label="Previous">⏪</button>
          <button id="playPauseBtn" class="now-playing-btn play-pause-btn" aria-label="Play/Pause">❚❚</button>
          <button id="nextBtn" class="now-playing-btn next-btn" aria-label="Next">⏩</button>
        </div>
        <div class="now-playing-right">
          <button id="queueBtn" class="now-playing-btn queue-btn">Queue</button>
          <div class="now-playing-progress">
            <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0">
            <span id="seekTime" class="seek-time">00:00 / 00:00</span>
          </div>
          <div class="now-playing-volume">
            <button id="muteBtn" class="mute-btn" aria-label="Mute">🔊</button>
            <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.1" value="0.8">
          </div>
        </div>
      </div>
    </div>

    <!-- Error container -->
    <div class="error-container"></div>
  </div>

  <audio id="player" preload="auto"></audio>
  <script src="renderer.js"></script>
</body>
</html>
