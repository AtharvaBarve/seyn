<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ViMusic PC</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      padding: 1rem;
      background: #1f1f1f;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 0.5rem 1rem;
      background: #3f51b5;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .content {
      padding: 1rem;
    }
    ul {
      list-style: none;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    li {
      padding: 0.5rem;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }
    li:hover {
      background: #333;
    }
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1f1f1f;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <button onclick="browseFolder()">📁 Browse Music Folder</button>
    <input id="search-input" type="text" placeholder="Search YouTube..." />
    <button onclick="searchYouTube()">Search</button>
  </div>

  <div class="content">
    <h3>Search Results:</h3>
    <ul id="search-results"></ul>

    <h3>Local Songs:</h3>
    <ul id="song-list"></ul>
  </div>

  <div class="footer">
    <div id="now-playing">🎵 Nothing playing</div>
    <audio id="audio-player" controls></audio>
  </div>

  <script>
    const audioPlayer = document.getElementById('audio-player');
    const nowPlaying = document.getElementById('now-playing');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const songList = document.getElementById('song-list');

    // Play audio file
    function playSong(filepath) {
      audioPlayer.src = filepath;
      audioPlayer.play();
      nowPlaying.textContent = `🎵 Now Playing: ${filepath.split(/[\\/]/).pop()}`;
    }

    // Load songs from cache
    async function loadCachedSongs() {
      const songs = await window.electronAPI.getLocalSongs();
      songList.innerHTML = '';
      songs.forEach(song => {
        const li = document.createElement('li');
        li.textContent = song.title;
        li.onclick = () => playSong(song.path);
        songList.appendChild(li);
      });
    }

    // Browse manually-selected folder
    async function browseFolder() {
      const folderSongs = await window.electronAPI.browseMusicFolder();
      if (!folderSongs) return;
      songList.innerHTML = '';
      folderSongs.forEach(song => {
        const li = document.createElement('li');
        li.textContent = song.title;
        li.onclick = () => playSong(song.path);
        songList.appendChild(li);
      });
    }

    // Search YouTube
    async function searchYouTube() {
      const query = searchInput.value.trim();
      if (!query) return;

      const results = await window.electronAPI.searchYouTube(query);
      searchResults.innerHTML = '';

      if (results.length === 0) {
        searchResults.innerHTML = '<li>No results found.</li>';
        return;
      }

      results.forEach(video => {
        const li = document.createElement('li');
        li.textContent = `${video.title} (${video.duration})`;
        li.title = video.description;
        li.onclick = () => downloadAndPlay(video);
        searchResults.appendChild(li);
      });
    }

    // Download from YouTube and play
    async function downloadAndPlay(video) {
      nowPlaying.textContent = `⬇️ Downloading: ${video.title}`;
      const filepath = await window.electronAPI.downloadAudio(video);
      if (filepath) {
        playSong(filepath);
        loadCachedSongs(); // refresh local list
      } else {
        alert('Failed to download audio.');
      }
    }

    // Auto-load cache folder on startup
    window.onload = () => {
      loadCachedSongs();
    };
  </script>
</body>
</html>
