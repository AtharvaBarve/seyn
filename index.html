<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViTune</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">V</div>
          <div class="brand-copy">
            <div class="brand-name">ViTune</div>
            <div class="brand-sub">Music for everyone</div>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Main navigation">
          <button class="nav-item" data-view="home">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-view="songs">
            <span class="nav-icon">♫</span>
            <span>Songs</span>
          </button>
          <button class="nav-item" data-view="videos">
            <span class="nav-icon">◉</span>
            <span>Videos</span>
          </button>
          <button class="nav-item" data-view="playlists">
            <span class="nav-icon">☷</span>
            <span>Playlists</span>
          </button>
          <button class="nav-item active" data-view="liked">
            <span class="nav-icon">♥</span>
            <span>Likes</span>
          </button>
          <button class="nav-item" data-view="history">
            <span class="nav-icon">◔</span>
            <span>History</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon">⚙</span>
            <span>Settings</span>
          </button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-shell">
            <span class="search-prefix">⌕</span>
            <input id="searchInput" type="text" placeholder="Search songs, artists, albums, or videos..." />
          </div>

          <div class="toolbar">
            <button id="searchBtn" class="primary-btn">Search</button>
          </div>
        </header>

        <div class="content-view active" id="homeView">
          <div class="page-heading">
            <h1>Home</h1>
          </div>
          <div class="home-panel">
            <div class="home-section">
              <h2>Recommended for you</h2>
              <div id="homeRecommendations" class="song-list"></div>
            </div>
          </div>
        </div>

        <div class="content-view" id="likedView">
          <div class="page-heading">
            <h1>Liked Songs</h1>
          </div>
          <div id="likedList" class="song-list"></div>
        </div>

        <div class="content-view" id="songsView">
          <div class="page-heading">
            <h1>Songs</h1>
            <span id="songsCount" class="view-count">0 songs</span>
          </div>
          <div id="songsList" class="song-list table-list"></div>
        </div>

        <div class="content-view" id="videosView">
          <div class="page-heading">
            <h1>Videos</h1>
            <span id="videosCount" class="view-count">0 videos</span>
          </div>
          <div id="videosList" class="song-list"></div>
        </div>

        <div class="content-view" id="searchView">
          <div class="page-heading">
            <h1>Search Results</h1>
            <span id="searchStatus" class="view-count">Ready</span>
          </div>
          <div id="searchList" class="song-list"></div>
        </div>

        <div class="content-view" id="playlistsView">
          <div class="page-heading">
            <h1>Playlists</h1>
          </div>
          <div id="playlistsList" class="song-list compact"></div>
        </div>

        <div class="content-view" id="historyView">
          <div class="page-heading">
            <h1>History</h1>
          </div>
          <div id="historyList" class="song-list compact"></div>
        </div>

        <div class="content-view" id="settingsView">
          <div class="page-heading">
            <h1>Settings</h1>
          </div>
          <div class="settings-grid">
            <div class="settings-card">
              <h3>Playback</h3>
              <label>Volume</label>
              <input id="settingsVolume" type="range" min="0" max="1" step="0.01" value="0.8" />
            </div>
            <div class="settings-card">
              <h3>Library</h3>
              <button id="refreshLibraryBtn" class="secondary-btn">Refresh Library</button>
            </div>
            <div class="settings-card">
              <h3>Cache</h3>
              <button id="clearCacheBtn" class="secondary-btn danger">Clear Cache</button>
              <div id="cacheInfo" class="cache-info">Ready</div>
            </div>
          </div>
        </div>
      </main>

      <aside class="detail-panel">
        <div class="detail-card">
          <img id="detailArt" src="https://placehold.co/360x360/1f1f1f/fff?text=Album" alt="album art" />
          <div class="detail-head">
            <div id="detailTitle" class="detail-title">Nothing playing</div>
            <div id="detailArtist" class="detail-artist">No artist</div>
          </div>

          <div id="lyricsPane">
            <div id="lyricsContent" class="lyrics-area">No lyrics available</div>
          </div>
        </div>
      </aside>
    </div>

    <footer class="player-bar">
      <div class="player-left">
        <img id="nowThumb" src="https://placehold.co/56x56/1f1f1f/fff?text=♫" alt="Now playing" />
        <div class="player-meta">
          <div id="nowTitle" class="now-title">Nothing playing</div>
          <div id="nowArtist" class="now-artist">Select a song</div>
        </div>
      </div>

      <div class="player-center">
        <div class="transport">
          <button id="prevBtn" class="transport-btn" aria-label="Previous">⏮</button>
          <button id="playPauseBtn" class="transport-btn primary" aria-label="Play / pause">▶</button>
          <button id="nextBtn" class="transport-btn" aria-label="Next">⏭</button>
        </div>
        <div class="progress-line">
          <span id="timeCurrent">0:00</span>
          <input id="seekBar" type="range" min="0" max="100" value="0" />
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button id="likeBtn" class="mini-btn" aria-label="Like">♥</button>
        <button id="muteBtn" class="mini-btn" aria-label="Mute">🔊</button>
        <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </footer>

    <audio id="player" preload="metadata"></audio>
    <script src="renderer.js"></script>
  </body>
</html>
