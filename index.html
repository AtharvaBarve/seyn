<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎵 Local & YouTube Music Player</h1>
    </header>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search YouTube...">
      <button id="searchBtn">Search</button>
    </div>

    <section>
     <h2>Songs</h2>
      <div id="songList" class="song-list-grid"></div>
    </section>


    <div class="search-results">
      <h2>📡 YouTube Results</h2>
      <div id="youtubeResults" class="song-list"></div>
    </div>
  </div>

  <div id="nowPlaying">
  <img id="nowThumb" src="" alt="thumb" />
  <div id="nowInfo">
    <div id="nowTitle">Nothing playing</div>
  </div>
  <button id="prevBtn">⏮️</button>
  <button id="nextBtn">⏭️</button>
  </div>


  <audio id="player" controls></audio>
  <script src="renderer.js"></script>
</body>
</html>
